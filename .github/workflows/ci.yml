name: CI

on:
  pull_request:
  push:
    branches-ignore: [main]   # main 푸시는 image.yml이 이 워크플로를 호출해서 실행한다
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: 린트, 타입, 데드코드, 테스트
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: 의존성 설치
        run: pip install -e ".[dev]"

      - name: 린트와 포맷
        run: make lint

      - name: 타입 검사
        run: make typecheck

      - name: 데드코드
        run: make deadcode

      - name: 테스트와 커버리지
        run: pytest --cov --cov-report=term-missing --cov-fail-under=95

  docker-smoke:
    name: Docker 이미지 빌드와 기동 확인
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: 이미지 빌드(amd64, 푸시 안 함)
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: rss-hub:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 컨테이너를 띄우고 /healthz 확인
        run: |
          docker run -d --name rss-hub-ci -p 8000:8000 -v rss-hub-ci-data:/data rss-hub:ci
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/healthz; then echo; break; fi
            if [ "$i" = 30 ]; then docker logs rss-hub-ci; exit 1; fi
            sleep 1
          done

      - name: 일반 사용자로 실행되는지 확인
        run: test "$(docker exec rss-hub-ci id -u)" = "10001"

      - name: API 문서 화면이 노출되지 않는지 확인
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8000/docs)
          test "$code" = "404"

      - name: 컨테이너 정리
        if: always()
        run: docker rm -f rss-hub-ci || true
