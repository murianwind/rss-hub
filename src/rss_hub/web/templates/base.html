<!doctype html>
<html lang="ko" data-theme="{{ ui_theme }}" data-font="{{ ui_font }}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>{% block title %}RSS Hub{% endblock %}</title>
<link rel="stylesheet" href="/static/app.css?v={{ ui_version }}">
<script src="/static/app.js?v={{ ui_version }}" defer></script>
</head>
<body class="app{% if ui_collapsed %} sidebar-collapsed{% endif %}">
{{ sprite() }}
<div class="shell">
{% include "_sidebar.html" %}
<div class="backdrop" data-action="close-drawer"></div>
<div class="main">
  <div class="mobilebar"><button type="button" class="icon-btn" data-action="open-drawer" aria-label="메뉴 열기">{{ icon('menu') }}</button><b>RSS Hub</b></div>
  {% if ui_toast %}<div class="toast" role="status" data-toast><span>{{ ui_toast }}</span><button type="button" class="icon-btn" data-action="close-toast" aria-label="닫기">{{ icon('x') }}</button></div>{% endif %}
  <div id="panel-slot" class="panel-slot" hidden></div>
  {% block main %}<div class="scroll"><div class="page">
{% block content %}{% endblock %}
  </div></div>{% endblock %}
</div>
</div>
</body>
</html>
