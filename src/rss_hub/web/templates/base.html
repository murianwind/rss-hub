<!doctype html>
<html lang="{{ page_lang or 'ko' }}" data-theme="{{ ui_theme }}" data-font="{{ ui_font }}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>{% block title %}RSS Hub{% endblock %}</title>
<link rel="stylesheet" href="/static/app.css?v={{ ui_asset_version }}">
<script src="/static/app.js?v={{ ui_asset_version }}" defer></script>
</head>
<body class="app{% block body_class %}{% endblock %}{% if ui_collapsed %} sidebar-collapsed{% endif %}{% if ui_sbw %} sw-{{ ui_sbw }}{% endif %}" data-auto-read="{{ ui_auto_read }}">
{{ sprite() }}
<div class="shell">
{% include "_sidebar.html" %}
<div class="resizer" id="resizer" role="separator" aria-orientation="vertical" aria-label="사이드바 너비 조절(끌거나 좌우 방향키, 두 번 누르면 기본 폭)" tabindex="0" title="끌어서 너비 조절 · 두 번 누르면 기본 폭"></div>
<div class="backdrop" data-action="close-drawer"></div>
<div class="main">
  <header class="mobilebar"><button type="button" class="icon-btn" data-action="open-drawer" aria-label="메뉴 열기">{{ icon('menu') }}</button><b>RSS Hub</b>{% block topbar_actions %}{% endblock %}</header>
  {% if ui_toast %}<div class="toast" role="status" data-toast><span>{{ ui_toast }}</span><button type="button" class="icon-btn" data-action="close-toast" aria-label="닫기">{{ icon('x') }}</button></div>{% endif %}
  <div id="panel-slot" class="panel-slot" hidden></div>
  {% block main %}<div class="scroll{% block scroll_class %}{% endblock %}"><div class="page{% block page_class %}{% endblock %}">
{% block content %}{% endblock %}
  </div></div>{% endblock %}
</div>
</div>
</body>
</html>
